<style>
  :root {
    --accent: #CCFF00;
    --accent-dim: rgba(204, 255, 0, 0.14);
    --bg: #0b0b0c;
    --bg-elevated: #141416;
    --panel: rgba(255, 255, 255, 0.045);
    --panel-border: rgba(255, 255, 255, 0.09);
    --text: #f2f2f2;
    --text-muted: #9a9a9e;
    --ok: #35d07f;
    --busy: #ff5c5c;
    --warn: #ffb84d;
    --radius: 18px;
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(circle at 20% 0%, #16181a 0%, #0b0b0c 55%);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app-shell { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 4px 18px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: 0.2px; }

  .tabs { display: flex; gap: 6px; background: var(--panel); padding: 4px; border-radius: 100px; border: 1px solid var(--panel-border); }
  .tab-btn {
    border: none; background: transparent; color: var(--text-muted);
    padding: 8px 16px; border-radius: 100px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .2s ease;
  }
  .tab-btn.active { background: var(--accent); color: #10120a; }

  .view { display: none; animation: fadeIn .25s ease; }
  .view.active { display: block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 24px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }

  .card h2 { margin: 0 0 6px; font-size: 20px; }
  .muted { color: var(--text-muted); font-size: 13.5px; margin: 0 0 18px; }

  .steps-indicator { display: flex; align-items: center; justify-content: center; margin: 6px 0 22px; }
  .step-dot {
    width: 30px; height: 30px; border-radius: 50%; background: var(--bg-elevated);
    border: 1px solid var(--panel-border); color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    position: relative;
  }
  .step-dot span { position: absolute; top: 36px; font-size: 11px; font-weight: 500; white-space: nowrap; color: var(--text-muted); }
  .step-dot.active { background: var(--accent); color: #10120a; border-color: var(--accent); }
  .step-line { width: 44px; height: 1px; background: var(--panel-border); margin: 0 6px; }

  .step-panel { display: none; }
  .step-panel.active { display: block; }

  .input-date {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--panel-border);
    background: var(--bg-elevated); color: var(--text); font-size: 15px; margin-bottom: 18px;
  }
  .input-date:focus { outline: none; border-color: var(--accent); }

  .btn-primary {
    background: var(--accent); color: #10120a; border: none; padding: 13px 22px;
    border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:hover { box-shadow: 0 0 20px var(--accent-dim); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-block { width: 100%; }

  .btn-secondary {
    background: transparent; color: var(--text); border: 1px solid var(--panel-border);
    padding: 13px 22px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer;
  }

  .btn-back {
    background: var(--bg-elevated); border: 1px solid var(--panel-border); color: var(--text);
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 16px; margin-right: 12px;
  }
  .panel-header { display: flex; align-items: center; margin-bottom: 16px; }
  .panel-header h2 { margin: 0; }
  .panel-header .muted { margin: 2px 0 0; }

  .legend { display: flex; gap: 16px; margin-bottom: 14px; }
  .legend-item { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot-disponible { background: var(--ok); }
  .dot-ocupado { background: var(--busy); }

  .grilla-turnos { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; padding-right: 4px; }
  .horario-grupo { border: 1px solid var(--panel-border); border-radius: 14px; padding: 12px; background: rgba(255,255,255,0.02); }
  .horario-hora { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .slots-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .slot-btn {
    flex: 1 1 auto; min-width: 90px; padding: 10px 8px; border-radius: 10px; text-align: center;
    font-size: 12.5px; font-weight: 600; border: 1px solid var(--panel-border); cursor: pointer;
    background: rgba(53, 208, 127, 0.08); color: #eafff2; transition: all .15s ease;
  }
  .slot-btn:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .slot-btn.ocupado { background: rgba(255,92,92,0.06); color: #756060; cursor: not-allowed; border-color: rgba(255,92,92,0.15); }
  .slot-btn.ocupado:hover { background: rgba(255,92,92,0.06); border-color: rgba(255,92,92,0.15); color: #756060; }

  .resumen-turno {
    background: var(--bg-elevated); border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 16px; margin-bottom: 18px;
  }
  .resumen-turno .fila { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13.5px; }
  .resumen-turno .fila span:first-child { color: var(--text-muted); }
  .resumen-turno .fila span:last-child { font-weight: 700; }
  .resumen-turno .fila.total span:last-child { color: var(--accent); font-size: 16px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .form-field.full { grid-column: 1 / -1; }
  .form-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
  .form-field input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--panel-border);
    background: var(--bg-elevated); color: var(--text); font-size: 14px;
  }
  .form-field input:focus { outline: none; border-color: var(--accent); }

  .form-error { color: var(--busy); font-size: 13px; margin-bottom: 12px; min-height: 0; }

  .confirm-icon {
    width: 56px; height: 56px; border-radius: 50%; background: var(--accent-dim); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;
    margin: 0 auto 16px;
  }
  #panel-4 { text-align: center; }
  #panel-4 h2 { margin-bottom: 4px; }

  .pago-opciones { display: flex; flex-direction: column; gap: 12px; margin-bottom: 8px; }
  .pago-opcion {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    background: var(--bg-elevated); border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 16px 18px; cursor: pointer; text-align: left; transition: all .15s ease;
  }
  .pago-opcion:hover { border-color: var(--accent); box-shadow: 0 0 16px var(--accent-dim); }
  .pago-opcion-titulo { font-size: 14px; font-weight: 700; color: var(--text); }
  .pago-opcion-monto { font-size: 22px; font-weight: 800; color: var(--accent); }
  .pago-opcion-nota { font-size: 12px; color: var(--text-muted); }

  .pasarela-demo {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1500; padding: 20px;
  }
  .pasarela-demo.hidden { display: none; }
  .pasarela-box {
    background: #141416; border: 1px solid var(--panel-border); border-radius: 18px; padding: 28px;
    max-width: 360px; width: 100%; text-align: center;
  }
  .pasarela-logo { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .pasarela-monto { font-size: 30px; font-weight: 800; color: var(--accent); margin: 16px 0; }
  .pasarela-spinner {
    width: 32px; height: 32px; border: 3px solid rgba(204,255,0,0.2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 18px;
  }
  .pasarela-acciones { display: flex; flex-direction: column; gap: 10px; }

  .codigo-copiable {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 0 22px;
    background: var(--bg-elevated); border: 1px solid var(--panel-border); border-radius: 12px; padding: 12px;
    font-size: 18px; font-weight: 800; letter-spacing: 1px;
  }
  .btn-icon-copy { background: none; border: none; cursor: pointer; font-size: 16px; }

  .resultado-consulta { margin-top: 18px; }
  .estado-badge { display: inline-block; padding: 4px 12px; border-radius: 100px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; }
  .estado-CONFIRMADA { background: rgba(204,255,0,0.16); color: var(--accent); }
  .estado-PARCIAL { background: rgba(255,184,77,0.14); color: var(--warn); }
  .estado-CANCELADA { background: rgba(255,92,92,0.14); color: var(--busy); }

  .loading-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .loading-overlay.hidden { display: none; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(204,255,0,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .form-grid { grid-template-columns: 1fr; }
    .step-dot span { font-size: 10px; }
  }
</style>
